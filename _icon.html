<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>icon</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  /* Build-only template, rendered at 512x512 then downscaled to
     180 / 32 / 16. At 16px only one shape survives, so the mark is a
     single Fraunces S over the table-edge rule — the wordmark itself
     is illegible at favicon size. */
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:512px; height:512px; }
  body{ background:#6E2733; display:flex; align-items:center; justify-content:center; }
  .mark{ display:flex; flex-direction:column; align-items:center; }
  .s{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-variation-settings:'SOFT' 30, 'WONK' 1, 'opsz' 72;
    font-size:360px; line-height:.78;
    color:#FAF6EE;
  }
  /* the table edge, thick enough to still read at 32px */
  .rule{ width:224px; height:26px; background:#FAF6EE; margin-top:26px; }
</style>
</head>
<body>
  <div class="mark">
    <span class="s">S</span>
    <span class="rule"></span>
  </div>
</body>
</html>
